<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef"/>
      <stop offset="100%" stop-color="#7579ff"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseBeam {
      0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
      50% { opacity: 0.75; stroke-dashoffset: -50; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-20px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(400px); opacity: 0; }
    }

    .bg-grid { opacity: 0.08; }
    .floating-anim-1 { animation: floatPill1 6s ease-in-out infinite; }
    .floating-anim-2 { animation: floatPill2 7s ease-in-out infinite; }
    .pulse-line { animation: pulseBeam 4s ease-in-out infinite; }
    .scan-beam { animation: scanline 8s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle High-Tech Grid Pattern in Background -->
  <g class="bg-grid" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="380" x2="1200" y2="380" />
  </g>

  <!-- Dynamic Glowing Circuit / Connection Lines (Placed behind foreground text) -->
  <g filter="url(#glow)">
    <path class="pulse-line" d="M 60 360 C 200 360, 260 380, 420 380 S 700 350, 900 370 S 1080 340, 1140 340" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="10 15"/>
    <path class="pulse-line" d="M 60 70 C 250 70, 320 50, 500 50 S 800 80, 1000 60 S 1100 80, 1140 80" fill="none" stroke="url(#neonPurple)" stroke-width="2" stroke-dasharray="8 12" style="animation-delay: -2s;"/>
  </g>

  <!-- Animated Ambient Nodes / Particles -->
  <g class="scan-beam">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#titleGrad)" stroke-width="2" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Floating Tech Badges / Pills (Placed at margins so title stays 100% visible) -->
  <g class="floating-anim-1">
    <!-- Top Left Pill -->
    <rect x="70" y="80" width="165" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="87" cy="97" r="5" fill="#38bdf8"/>
    <text x="100" y="102" fill="#e2e8f0" class="badge-text">🤖 Autonomous Agents</text>
  </g>

  <g class="floating-anim-2">
    <!-- Top Right Pill -->
    <rect x="965" y="80" width="165" height="34" rx="17" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="982" cy="97" r="5" fill="#c084fc"/>
    <text x="995" y="102" fill="#e2e8f0" class="badge-text">⚡ MCP Runtimes</text>
  </g>

  <g class="floating-anim-2">
    <!-- Bottom Left Pill -->
    <rect x="70" y="310" width="175" height="34" rx="17" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="87" cy="327" r="5" fill="#818cf8"/>
    <text x="100" y="332" fill="#e2e8f0" class="badge-text">🌐 Cloud Headless Fleet</text>
  </g>

  <g class="floating-anim-1">
    <!-- Bottom Right Pill -->
    <rect x="955" y="310" width="175" height="34" rx="17" fill="url(#badgeGrad)" stroke="#34d399" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="972" cy="327" r="5" fill="#34d399"/>
    <text x="985" y="332" fill="#e2e8f0" class="badge-text">🛡️ Anti-Detect &amp; Stealth</text>
  </g>

  <!-- Center Decorative Glow Halo behind title -->
  <ellipse cx="600" cy="195" rx="360" ry="110" fill="#38bdf8" opacity="0.08" filter="url(#pulseGlow)"/>

  <!-- Foreground Main Content: Crystal Clear, Never Obscured -->
  <g>
    <!-- Tagline pill -->
    <rect x="470" y="85" width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="600" y="104" fill="#38bdf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="180" fill="url(#titleGrad)" class="title-text" font-size="44" text-anchor="middle" filter="drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6))">
      Web Agent &amp; Browser Automation
    </text>

    <!-- Subtitle -->
    <text x="600" y="225" fill="url(#subGrad)" class="sub-text" font-size="18" text-anchor="middle">
      Autonomous AI Browsers • In-Page GUI Copilots • Cloud CDP Runtimes • MCP Servers
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(320, 260)">
      <rect x="0" y="0" width="160" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="80" y="20" fill="#93c5fd" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">🎯 Vision &amp; DOM LAMs</text>

      <rect x="180" y="0" width="180" height="30" rx="6" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="270" y="20" fill="#c7d2fe" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">🚀 Serverless Browser API</text>

      <rect x="380" y="0" width="180" height="30" rx="6" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
      <text x="470" y="20" fill="#e9d5ff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">⚡ Model Context Protocol</text>
    </g>
  </g>
</svg>
